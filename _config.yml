# Jekyll configuration
markdown: kramdown
highlighter: rouge
paginate: 100 # it will paginate after this number
language: 'es'
words_per_minute: 180

# edit baseurl to simply '/' if using as your personal page (instead of a project page)
baseurl: /

# Website info
name: El taller del huerto
title: ¿Plantas y automatización?
description: Si eres curios@, aprende de forma práctica cómo aplicar la tecnología en el cuidado de tus plantas
cover: assets/images/blog-cover.jpg
logo: assets/images/icon-rounded.png
logo_dark: assets/images/icon-rounded.png
favicon: assets/images/favicon
url: https://eltallerdelhuerto.com
source_url: https://github.com/carrascoacd/eltallerdelhuerto/
CNAME: eltallerdelhuerto.com

# Social info
navigation: True # show the navbar links
subscribers: False # you need to connect an external service for this to work,
# if 'True' the submit button is disabled for now, but you can change that
# by editing `_includes/subscribe-form.html`
twitter: tallerdelhuerto # replace by your username
# facebook: ghost # replace by your username
# pinterest: eltallerdelhuerto

# Disqus
disqus: True
disqus_shortname: eltallerdelhuerto # replace with your disqus username

# Google Analytics
google_analytics: G-M1QWDCLYE3

# Permalinks
permalink: /:title
# permalink: /author/:author
# permalink: /tag/:tag

# Authors' info in `_data/authors.yml`
# Tags' info in `_data/tags_info.yml`

# gems and other configs
plugins_dir: [_plugins]
plugins: [jekyll-paginate, jekyll-feed]

feed:
  path: feed.xml

# Additional settings available on the front-matter
# Site logo in the index.html (as in demo.ghost.io)
# Author's page cover in _layouts/author.html
# The same for page.html and tag.html layouts
# Post's page cover as a per-post basis _posts/...
# Disqus comments as a per-post basis
# ...

# Production URL used for social sharing links (see _includes/floating-header.html)
production_url: https://eltallerdelhuerto.com/

exclude:
  - assets/css
  - node_modules
  - vendor
  - .travis.yml
  - Gemfile
  - Gemfile.lock
  - GHOST.txt
  - gulpfile.js
  - LICENSE
  - package.json
  - Rakefile
  - README.md
  - script.py
  - changelog.md
  - "*.Rmd"
  - .git*
